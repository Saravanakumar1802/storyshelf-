[project]
name = "ai-library-api"
version = "0.1.0"
description = "FastAPI backend for the StoryShelf AI Library: auth, books, reader, AI search, recommendations, RAG chat and an MCP server."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "pydantic>=2.11",
    "pydantic-settings>=2.11",
    "pymongo>=4.15",
    "dnspython>=2.8",
    "pyjwt>=2.10",
    "pwdlib[argon2]>=0.2",
    "email-validator>=2.3",
    "httpx>=0.28",
    "selectolax>=0.4",
    "litellm>=1.79",
    "fastembed>=0.7",
    "mcp>=1.20",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "httpx>=0.28",
    "ruff>=0.14",
    "mypy>=1.18",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: needs a real MongoDB (MONGODB_URI in .env)"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
# book text is typographic: en dashes and curly quotes in strings are intended
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]
